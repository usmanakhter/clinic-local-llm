name: clinical_assistant
description: Nepal clinical reference MVP — offline drug, interaction, and guideline lookup.
publish_to: 'none'
version: 1.0.0+3

environment:
  sdk: ^3.12.2

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: ^1.0.8
  sqflite: ^2.4.2
  path: ^1.9.1
  path_provider: ^2.1.5
  shared_preferences: ^2.5.3
  http: ^1.6.0
  llamadart: ^0.8.16
  crypto: ^3.0.6
  sqflite_common_ffi: ^2.4.2
dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter:
  uses-material-design: true
  assets:
    - assets/nepal/drugs.json
    - assets/nepal/interactions.json
    - assets/nepal/guideline_chunks.json
    - assets/nepal/opd_condition_checklist.json
    - assets/nepal/consent_templates.json
    - assets/nepal/note_drafter_samples.json
    - assets/legal/terms_of_use.txt
